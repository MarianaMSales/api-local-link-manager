name: api-local-link-manager

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: api_local_link_manager
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    networks:
      - docker-network
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  docker-network:
    driver: bridge

volumes:
  postgres-data:
